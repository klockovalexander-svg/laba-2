name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pymarkdownlnt
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Check Markdown
        run: pymarkdown --disable-rules MD013,MD041 scan README.md docs

      - name: Check Python
        if: ${{ hashFiles('**/*.py') != '' }}
        run: python -m flake8 . --exclude=.git,venv,.venv

      - name: Run tests
        if: ${{ hashFiles('tests/**/test_*.py') != '' }}
        run: python -m unittest discover -s tests -p "test_*.py" -v